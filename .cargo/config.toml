[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
# The Fedora cross-gcc was built with --with-sysroot=/usr/aarch64-linux-gnu/sys-root
# but the actual sysroot on this host is /usr/aarch64-redhat-linux/sys-root/fc44.
# Pass --sysroot to both the C compiler (for ring/cc-rs crates) and the linker.
# Also add the gcc lib dir so -lgcc_s resolves (cross-gcc is built --disable-shared,
# so a GROUP ( libgcc.a ) stub at /usr/lib/gcc/aarch64-linux-gnu/16/libgcc_s.so
# satisfies the dynamic link request with the static archive instead).
rustflags = [
    "-C", "link-arg=--sysroot=/usr/aarch64-redhat-linux/sys-root/fc44",
    "-C", "link-arg=-L/usr/lib/gcc/aarch64-linux-gnu/16",
]

[env]
CFLAGS_aarch64_unknown_linux_gnu = "--sysroot=/usr/aarch64-redhat-linux/sys-root/fc44"
CXXFLAGS_aarch64_unknown_linux_gnu = "--sysroot=/usr/aarch64-redhat-linux/sys-root/fc44"
